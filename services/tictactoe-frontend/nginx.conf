server {
    listen 80;
    server_name _;

    # Docker's embedded DNS. Required because of the variable in proxy_pass below.
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — every unmatched path serves the React app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/api/(.*)$ {
        # The hostname is held in a variable on purpose. With a literal, nginx
        # resolves it once at startup and refuses to boot if the session
        # container is not yet up; with a variable it resolves per request.
        set $session_upstream http://tictactoe-session:8082;

        # Trailing slash on the proxy target strips the /api/ prefix:
        #   /api/sessions/{id}/events  ->  /sessions/{id}/events
        proxy_pass $session_upstream/$1$is_args$args;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id  $http_x_correlation_id;

        # SSE. Both directives are load-bearing — see ADR 0005 Consequences.
        proxy_set_header Connection '';   # no keep-alive header to upstream
        proxy_buffering off;              # without this nginx holds events in a buffer
        proxy_cache off;
        proxy_read_timeout 1h;            # default 60s would sever the stream mid-game
        chunked_transfer_encoding off;
    }
}
