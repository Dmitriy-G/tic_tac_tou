server:
  port: 8082

spring:
  application:
    name: tictactoe-session
  datasource:
    url: ${SESSION_DB_URL:jdbc:postgresql://localhost:5434/session_db}
    username: ${SESSION_DB_USERNAME:session}
    password: ${SESSION_DB_PASSWORD:session}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

game-engine:
  base-url: ${ENGINE_BASE_URL:http://localhost:8081}
  connect-timeout-ms: ${ENGINE_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${ENGINE_READ_TIMEOUT_MS:3000}

simulation:
  move-delay-ms: ${SIMULATION_MOVE_DELAY_MS:500}
  error-counts-threshold: ${SIMULATION_ERROR_COUNTS_THRESHOLD:10}
  strategy:
    x: ${SIMULATION_STRATEGY_X:SIMPLE}
    o: ${SIMULATION_STRATEGY_O:SIMPLE}

management:
  endpoints:
    web:
      exposure:
        include: health,info