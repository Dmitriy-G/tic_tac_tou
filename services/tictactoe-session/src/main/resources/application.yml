server:
  port: 8082

spring:
  application:
    name: tictactoe-session
  datasource:
    url: ${SESSION_DB_URL:jdbc:postgresql://localhost:5434/session_db}
    username: ${SESSION_DB_USERNAME:session}
    password: ${SESSION_DB_PASSWORD:session}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

game-engine:
  base-url: ${ENGINE_BASE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info