spring:
  datasource:
    url: jdbc:h2:mem:session_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

simulation:
  move-delay-ms: 0

game-engine:
  retry:
    initial-backoff-ms: 1

sse:
  # Long enough that the heartbeat's @Scheduled task never fires during a test run — avoids
  # background-thread noise/flakiness without disabling @EnableScheduling itself.
  heartbeat-interval-ms: 3600000