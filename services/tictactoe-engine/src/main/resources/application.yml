server:
  port: 8081

spring:
  application:
    name: tictactoe-engine
  datasource:
    url: ${ENGINE_DB_URL:jdbc:postgresql://localhost:5433/engine_db}
    username: ${ENGINE_DB_USERNAME:engine}
    password: ${ENGINE_DB_PASSWORD:engine}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info