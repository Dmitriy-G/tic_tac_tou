services:
  tictactoe-engine:
    build:
      context: .
      dockerfile: services/tictactoe-engine/Dockerfile
    ports:
      - "8081:8081"

  tictactoe-session:
    build:
      context: .
      dockerfile: services/tictactoe-session/Dockerfile
    ports:
      - "8082:8082"
    environment:
      ENGINE_BASE_URL: http://tictactoe-engine:8081
    depends_on:
      - tictactoe-engine

  tictactoe-frontend:
    build:
      context: services/tictactoe-frontend
    ports:
      - "5173:80"
    environment:
      VITE_SESSION_SERVICE_URL: http://localhost:8082
    depends_on:
      - tictactoe-session
