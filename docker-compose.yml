services:
  engine-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: engine_db
      POSTGRES_USER: engine
      POSTGRES_PASSWORD: engine
    volumes:
      - engine-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engine -d engine_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  session-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: session_db
      POSTGRES_USER: session
      POSTGRES_PASSWORD: session
    volumes:
      - session-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U session -d session_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  tictactoe-engine:
    build:
      context: .
      dockerfile: services/tictactoe-engine/Dockerfile
    expose:
      - "8081"
    environment:
      ENGINE_DB_URL: jdbc:postgresql://engine-db:5432/engine_db
      ENGINE_DB_USERNAME: engine
      ENGINE_DB_PASSWORD: engine
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-only-not-a-secret}
    depends_on:
      engine-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 10

  tictactoe-session:
    build:
      context: .
      dockerfile: services/tictactoe-session/Dockerfile
    ports:
      - "8082:8082"
    environment:
      ENGINE_BASE_URL: http://tictactoe-engine:8081
      SESSION_DB_URL: jdbc:postgresql://session-db:5432/session_db
      SESSION_DB_USERNAME: session
      SESSION_DB_PASSWORD: session
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-only-not-a-secret}
    depends_on:
      tictactoe-engine:
        condition: service_healthy
      session-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 10

  tictactoe-frontend:
    build:
      context: services/tictactoe-frontend
    ports:
      - "5173:80"
    depends_on:
      tictactoe-session:
        condition: service_healthy

  # Republishes the engine's port on demand, for Swagger UI / manual API exploration:
  #   docker compose --profile debug up -d
  #   curl http://localhost:8081/actuator/health
  engine-debug-ports:
    image: alpine/socat
    profiles: ["debug"]
    command: TCP-LISTEN:8081,fork,reuseaddr TCP:tictactoe-engine:8081
    ports:
      - "8081:8081"
    depends_on:
      - tictactoe-engine

volumes:
  engine-db-data:
  session-db-data:
